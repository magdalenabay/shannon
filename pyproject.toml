[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shannon-cli"
version = "0.1.0"
description = "Universal file conversion CLI — one verb for every format pair."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "magdalenabay", email = "83650010+magdalenabay@users.noreply.github.com" }]
keywords = ["convert", "ffmpeg", "imagemagick", "pandoc", "cli", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "tomli-w>=1.0",
]

[project.scripts]
shannon = "shannon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/magdalenabay/shannon"
Repository = "https://github.com/magdalenabay/shannon"
Issues = "https://github.com/magdalenabay/shannon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shannon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
